<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Santhosh Kumar N, Software Engineer, Backend and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#1a0707"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff2b2b" stop-opacity="0.34"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2b2b"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      .float { animation: float 6s ease-in-out infinite; transform-origin: 40px 40px; }
      .drift { animation: drift 9s ease-in-out infinite alternate; }
      .cyc { opacity: 0; animation: cyc 12s infinite; }
      .c1 { opacity: 1; animation-delay: 0s; } .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; } .c4 { animation-delay: 9s; }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
      @keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes cyc { 0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; transform: translateY(0); } 26% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <g class="drift"><circle cx="980" cy="150" r="300" fill="url(#glow)"/></g>
    <rect x="0" y="296" width="1200" height="4" fill="url(#line)"/>
    <g transform="translate(78 74)"><g class="float"><svg width="152" height="152" viewBox="0 0 64 64"><defs><linearGradient id="lr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#cc0000"/></linearGradient><radialGradient id="lh"><stop offset="0" stop-color="#ff2b2b" stop-opacity=".5"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></radialGradient></defs><circle cx="32" cy="32" r="14" fill="url(#lh)"/><g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M32 5.5 55 18.75v26.5L32 58.5 9 45.25v-26.5Z" stroke="#fff" stroke-width="3"/><path d="M32 17 45 39.5H19Z" stroke="#fff" stroke-opacity=".3" stroke-width="1.6"/><path d="M32 32V17M32 32l13 7.5M32 32 19 39.5" stroke="#fff" stroke-opacity=".9" stroke-width="2.4"/></g><circle cx="32" cy="32" r="5.6" fill="url(#lr)"/><circle cx="32" cy="17" r="3.3" fill="#fff"/><circle cx="45" cy="39.5" r="3.3" fill="#fff"/><circle cx="19" cy="39.5" r="3.3" fill="#fff"/></svg></g></g>
    <text x="276" y="104" class="mono" font-size="15" font-weight="700" letter-spacing="4" fill="#ff5a5a">SOFTWARE ENGINEER  ·  BACKEND &amp; AI</text>
    <text x="274" y="168" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Santhosh Kumar <tspan fill="#ff2b2b">N</tspan></text>
    <g class="mono" font-size="24" fill="#d0d0d0">
      <text x="276" y="226" class="cyc c1">&gt; building reliable backend systems</text>
      <text x="276" y="226" class="cyc c2">&gt; designing REST APIs &amp; data models</text>
      <text x="276" y="226" class="cyc c3">&gt; shipping AI-powered applications</text>
      <text x="276" y="226" class="cyc c4">&gt; turning ideas into deployable software</text>
    </g>
  </g>
</svg>
