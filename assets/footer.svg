<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Open to Software Engineering and AI Engineering opportunities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#1a0707"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2b2b"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></linearGradient>
    <clipPath id="round"><rect width="1200" height="120" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>
    <text x="600" y="59" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan class="dot" fill="#2ecc71">●</tspan>  Open to Software Engineering &amp; AI Engineering opportunities</text>
    <text x="600" y="94" font-size="15" text-anchor="middle" fill="#9a9a9a" letter-spacing="1">I build, document, test and improve systems, from idea to deployable software.</text>
  </g>
</svg>
